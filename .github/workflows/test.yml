name: 🧪 Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: ⚗️ pytest
    runs-on: ubuntu-latest
    steps:
    - name: 📰 Checkout
      uses: actions/checkout@v7

    - name: 🐍 Set up PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: '3.12'
        cache: true

    - name: 📦 Install dependencies
      run: pdm install

    - name: 🧫 Run tests
      run: pdm test
